{% if page.has_other_pages %}<nav class="balance-nav no-print" aria-label="Paginación"><span>Página {{ page.number }} de {{ page.paginator.num_pages }}</span>{% if page.has_previous %}<a href="?{{ querystring }}&page={{ page.previous_page_number }}">Anterior</a>{% endif %}{% if page.has_next %}<a href="?{{ querystring }}&page={{ page.next_page_number }}">Siguiente</a>{% endif %}</nav>{% endif %}
